[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tccn-corpus"
version = "0.1.0"
description = "Taiwan Age-Appropriate Children's Story & Nursery Rhymes Corpus tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "jsonlines>=4.0,<5",
  "playwright>=1.45,<2",
  "requests>=2.31,<3",
  "scrapy>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["crawlers*"]
